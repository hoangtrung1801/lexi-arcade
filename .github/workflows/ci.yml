name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm content:validate
      - run: pnpm test # unit tests (API tests skip themselves when no server is running)

  e2e:
    runs-on: ubuntu-latest
    needs: check
    env:
      VITE_E2E: "1" # exposes the engine hook + dev login button in this test build only
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: cp .dev.vars.example .dev.vars
      - run: pnpm build
      - run: pnpm db:migrate:local
      - run: pnpm content:seed
      - name: Start preview server
        run: |
          nohup pnpm exec vite preview --port 4173 --strictPort > preview.log 2>&1 &
          for i in $(seq 1 60); do curl -fsS localhost:4173/api/health && break; sleep 1; done
      - name: API integration tests
        run: pnpm test
        env:
          API_BASE: http://localhost:4173
      - name: Playwright smoke tests
        run: pnpm test:e2e
        env:
          E2E_BASE: http://localhost:4173
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-debug
          path: |
            playwright-report
            test-results
            preview.log
